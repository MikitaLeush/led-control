name: android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Protocol first: if a frame changed, fail here rather than on the strip.
      - name: Protocol tests
        run: npm test

      # AGP 8.13 / Gradle 8.14.3, per android/build.gradle and the wrapper.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk is 36 (see android/variables.gradle) and is not guaranteed to
      # be on the runner image. This installs it and accepts the licences.
      - uses: android-actions/setup-android@v3
      - name: Ensure compileSdk 36 is present
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # src/vendor is generated, not committed — it must exist before cap sync
      # copies webDir into the Android assets.
      - name: Sync web assets into Android
        run: npm run sync:android

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: led-control-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
